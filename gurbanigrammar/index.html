<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gurbani Grammar Academy | GurmatKhajana</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:white;
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(212,164,44,0.08),
    transparent 45%);

    pointer-events:none;
    z-index:-1;
}

body::after{
    content:'';

    position:fixed;
    inset:0;

    background:

    radial-gradient(circle at 15% 20%,
    rgba(212,164,44,0.10),
    transparent 25%),

    radial-gradient(circle at 85% 30%,
    rgba(212,164,44,0.08),
    transparent 30%),

    radial-gradient(circle at 50% 80%,
    rgba(255,255,255,0.03),
    transparent 35%);

    pointer-events:none;
    z-index:-2;
}

a{
    text-decoration:none;
    color:inherit;
}

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;

    padding:22px 6%;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    background:
    linear-gradient(
    to bottom,
    rgba(0,0,0,0.88),
    rgba(0,0,0,0.15));

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid rgba(255,255,255,0.05);
}

.nav-links{
    display:flex;
    gap:35px;
}

.nav-links a{
    font-size:0.82rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#ddd;
}

.nav-links a:hover{
    color:#d4a42c;
}

.hero{
    position:relative;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
    linear-gradient(
    rgba(0,0,0,0.50),
    rgba(0,0,0,0.9)),
    url('../images/gallery/siteimages/2.jpeg')
    center/cover fixed;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at center,
    transparent 10%,
    rgba(0,0,0,0.72) 100%);
}

.akj-top-logo{
    position:absolute;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
}

.akj-top-logo img{
    width:95px;
}

.hero-content{
    position:relative;
    z-index:10;

    width:100%;
    max-width:1200px;

    text-align:center;

    padding-top:150px;
}

.main-logo img{
    width:min(90vw,520px);
    display:block;
    margin:auto;
    margin-bottom:30px;
}

.archive-line{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;

    margin-bottom:30px;
}

.archive-line span{
    width:140px;
    height:1px;
    background:rgba(212,164,44,0.35);
}

.archive-line p{
    color:#d4a42c;
    letter-spacing:4px;
    font-size:0.85rem;
}

.page-title{
    font-family:'Cormorant Garamond',serif;
    font-size:5rem;
    margin-bottom:20px;
}

.tagline{
    font-size:1.4rem;
    color:#ddd;
    margin-bottom:50px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.btn{
    padding:17px 38px;
    border-radius:50px;
    font-weight:600;
}

.btn-gold{
    background:#d4a42c;
    color:black;
}

.btn-dark{
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
}

.section{
    padding:100px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
}

.section-title span{
    color:#d4a42c;
    letter-spacing:3px;
    font-size:0.8rem;
    text-transform:uppercase;
}

.section-title h2{
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    margin-top:10px;
}
/* COURSE MODULES */

.modules-wrapper{
max-width:1100px;
margin:auto;

```
display:flex;
flex-direction:column;
gap:30px;
```

}

.module-card{

```
display:block;

padding:45px;

border-radius:30px;

background:
linear-gradient(
135deg,
rgba(20,20,20,0.75),
rgba(10,10,10,0.45));

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

transition:0.4s ease;

position:relative;

overflow:hidden;
```

}

.module-card:hover{

```
transform:translateY(-8px);

border-color:
rgba(212,164,44,0.35);

box-shadow:
0 20px 50px rgba(0,0,0,0.45);
```

}

.module-card::before{

```
content:'';

position:absolute;

top:0;
left:0;

width:4px;
height:100%;

background:#d4a42c;
```

}

.module-label{

```
color:#d4a42c;

letter-spacing:3px;

text-transform:uppercase;

font-size:0.8rem;

margin-bottom:15px;
```

}

.module-title{

```
font-family:'Cormorant Garamond',serif;

font-size:2.8rem;

margin-bottom:15px;
```

}

.module-description{

```
color:#ccc;

line-height:1.9;

max-width:800px;

margin-bottom:25px;
```

}

.module-meta{

```
display:flex;

gap:15px;

flex-wrap:wrap;
```

}

.module-badge{

```
display:inline-block;

padding:10px 18px;

border-radius:50px;

background:
rgba(212,164,44,0.12);

border:
1px solid rgba(212,164,44,0.25);

color:#d4a42c;

font-size:0.82rem;

letter-spacing:1px;
```

}

/* FEATURED LESSON */

.featured-lesson{

```
max-width:1100px;

margin:auto;

padding:45px;

border-radius:30px;

background:
linear-gradient(
135deg,
rgba(20,20,20,0.75),
rgba(10,10,10,0.45));

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(12px);
```

}

.gurbani-example{

```
margin:30px 0;

padding:25px;

background:#111;

border-left:4px solid #d4a42c;

font-size:1.8rem;
```

}
/* MOBILE */

@media(max-width:700px){

```
.page-title{
    font-size:2.8rem;
    padding:0 20px;
}

.tagline{
    font-size:1.1rem;
    padding:0 20px;
}

.module-title{
    font-size:2rem;
}

.module-card{
    padding:30px;
}
```

}

</style>
